# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: ledger
    runtime: node
    plan: free
    region: singapore  # closest Render region to Australia and the Atlas Sydney cluster
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ATLAS_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_REGISTRATION
        value: "true"
